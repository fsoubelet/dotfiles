[experimental]

[completion]
activate_on_typing = true
copilot = "custom"
signature_hint_on_typing = false

[runtime]
default_auto_download = []
on_cell_change = "autorun"
auto_reload = "off"
default_sql_output = "auto"
watcher_on_save = "lazy"
default_csv_encoding = "utf-8"
reactive_tests = false
auto_instantiate = false
output_max_bytes = 8000000
std_stream_max_bytes = 1000000

[diagnostics]
sql_linter = true

[formatting]
line_length = 110

[server]
follow_symlink = false
browser = "default"

[mcp]
presets = ["marimo"]

[mcp.mcpServers]

[ai]
rules = "Always use type hints and provide docstrings. Prefer the numpy docstring style. Prefer polars over pandas."
mode = "manual"

[ai.custom_providers]

[ai.anthropic]

[ai.models]
chat_model = ""
custom_models = []
edit_model = ""
autocomplete_model = ""
displayed_models = []

[ai.google]

[ai.bedrock]

[ai.open_ai]

[keymap]
preset = "default"
destructive_delete = true

[keymap.overrides]

[snippets]
include_default_snippets = true
custom_paths = []

[display]
code_editor_font_size = 14
default_table_max_columns = 50
reference_highlighting = true
cell_output = "below"
theme = "light"
default_table_page_size = 10
default_width = "medium"
dataframes = "rich"

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[package_management]
manager = "uv"

[language_servers.ty]
enabled = false

[language_servers.pylsp]
enable_ruff = true
enabled = false
enable_mypy = true
enable_pydocstyle = false
enable_flake8 = false
enable_pylint = false
enable_pyflakes = false
