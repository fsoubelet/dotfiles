[snippets]
include_default_snippets = true
custom_paths = []

[completion]
activate_on_typing = true
copilot = false

[formatting]
line_length = 110

[diagnostics]

[package_management]
manager = "uv"

[keymap]
preset = "default"
destructive_delete = true

[keymap.overrides]

[save]
autosave_delay = 1000
autosave = "after_delay"
format_on_save = true

[language_servers.ty]

[language_servers.pylsp]
enable_pydocstyle = false
enable_ruff = true
enable_mypy = true
enabled = true
enable_pylint = false
enable_pyflakes = false
enable_flake8 = false

[ai]
mode = "manual"
rules = ""

[ai.google]

[ai.bedrock]

[ai.open_ai]

[ai.anthropic]

[ai.models]
displayed_models = []
custom_models = []

[server]
browser = "default"
follow_symlink = false

[runtime]
auto_instantiate = false
default_auto_download = []
reactive_tests = true
std_stream_max_bytes = 1000000
default_sql_output = "auto"
output_max_bytes = 8000000
on_cell_change = "autorun"
watcher_on_save = "lazy"
auto_reload = "off"

[experimental]

[display]
cell_output = "above"
default_table_max_columns = 50
theme = "light"
code_editor_font_size = 14
default_table_page_size = 10
dataframes = "rich"
default_width = "medium"
reference_highlighting = false
